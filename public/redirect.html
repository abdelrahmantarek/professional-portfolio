<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Portfolio</title>
    <script>
        // Redirect to default locale (Arabic)
        // Check if we're already on a locale path
        const path = window.location.pathname;
        console.log('Current path:', path);
        console.log('Current href:', window.location.href);

        if (path === '/' || path === '/index.html') {
            // Detect user's preferred language from browser settings
            const userLang = navigator.language || navigator.userLanguage;
            const preferredLocale = userLang.startsWith('ar') ? 'ar' : 'ar'; // Default to Arabic

            console.log('Redirecting to:', preferredLocale);

            // Use setTimeout to ensure the redirect happens after page load
            setTimeout(() => {
                window.location.href = `/${preferredLocale}/index.html`;
            }, 100);
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .loader {
            text-align: center;
            color: white;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>
</body>
</html>
